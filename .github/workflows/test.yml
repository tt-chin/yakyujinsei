name: Tests
on:
  push:
    branches: [dev]
    # Exact evidence-only allowlist; never apply this filter to pull_request.
    paths-ignore:
      - BACKLOG.md
      - docs/reviews/STAGE6_ACCEPTANCE_AUDIT.md
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Test profile
        type: choice
        required: true
        default: quick
        options: [quick, full, audit]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TEST_MODE: ${{ github.event_name == 'pull_request' && 'full' || inputs.mode || 'quick' }}
      TEST_BROWSER: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install test-only Playwright
        shell: bash
        run: |
          mkdir -p test-results/ci-bootstrap
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/test-tools/node_modules/playwright"
          echo "PLAYWRIGHT_MODULE=$PLAYWRIGHT_MODULE" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/test-tools" --no-save --no-package-lock --ignore-scripts playwright@1.62.1 2>&1 | tee test-results/ci-bootstrap/playwright-install.log
          node "$PLAYWRIGHT_MODULE/cli.js" install --with-deps chromium 2>&1 | tee test-results/ci-bootstrap/chromium-install.log
      - name: Validate workflow
        run: node scripts/check-workflow.mjs
      - name: Run test profile
        if: env.TEST_MODE != 'full'
        run: node scripts/test.mjs "$TEST_MODE" --output=test-results/ci
      - name: Plan Full batches
        id: full-plan
        if: env.TEST_MODE == 'full'
        run: node scripts/ci-full-batches.mjs plan
      - name: Run Full batch 1/8
        if: ${{ always() && env.TEST_MODE == 'full' && steps.full-plan.outcome == 'success' }}
        run: node scripts/ci-full-batches.mjs run 1
      - name: Save Full batch 1 evidence
        if: ${{ always() && env.TEST_MODE == 'full' && steps.full-plan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-full-${{ github.run_id }}-${{ github.run_attempt }}-batch-1
          retention-days: 14
          if-no-files-found: error
          compression-level: 1
          path: |
            test-results/ci-full/plan.json
            test-results/ci-full/batch-1/*.log
            test-results/ci-full/batch-1/*.json
            test-results/ci-full/batch-1/tmp/yakyujinsei-*/**
            test-results/ci-full/batch-1/tmp/yakyujinsei-*.json
            test-results/ci-full/batch-1/tmp/runner-contract-*/**
      - name: Run Full batch 2/8
        if: ${{ always() && env.TEST_MODE == 'full' && steps.full-plan.outcome == 'success' }}
