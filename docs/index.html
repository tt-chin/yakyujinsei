
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fff8f8">
<title>野球人生シミュレーター</title>
<meta name="description" content="高校野球から殿堂入りまで、日本人野球選手の人生をシード付きでシミュレーション。NPBドラフト、大学・社会人・独立、海外挑戦、日本代表、ケガ、恋愛、引退――すべての決断が野球人生を左右します。">
<meta property="og:type" content="website">
<meta property="og:title" content="野球人生シミュレーター">
<meta property="og:description" content="高校野球から殿堂入りまで、日本人野球選手の人生をシード付きでシミュレーション。NPBドラフト、大学・社会人・独立、海外挑戦、日本代表、ケガ、恋愛、引退――すべての決断が野球人生を左右します。">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="野球人生シミュレーター">
<meta name="twitter:description" content="高校野球から殿堂入りまで、日本人野球選手の人生をシード付きでシミュレーション。NPBドラフト、大学・社会人・独立、海外挑戦、日本代表、ケガ、恋愛、引退――すべての決断が野球人生を左右します。">
<link rel="icon" type="image/png" href="./assets/baseball-icon.png">
<link rel="apple-touch-icon" href="./assets/baseball-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/ui-navigation.css">
<link rel="stylesheet" href="./styles/jp-theme.css">
</head>
  <body>
<div id="start">
  <div class="wrap">
    <div class="stitch"></div>
    <h1 id="logo-tap"><em>野球人生シミュレーター</em><span id="app-version" style="margin-left:8px;font-family:monospace;font-size:11px;font-weight:500;letter-spacing:.04em;color:var(--dim);white-space:nowrap;vertical-align:middle"></span></h1>
    <p class="sub">高校野球からNPBドラフト、海外挑戦、日本代表、引退まで。すべての選択が野球人生を変える。</p>
    <div class="field"><label>選手名</label><input id="in-name" maxlength="10" placeholder="例：山田太郎" value=""></div>
    <div class="field"><label>ポジション</label>
      <div class="seg" id="seg-pos">
        <button data-v="P" class="on">投手</button><button data-v="C">捕手</button>
        <button data-v="IF">内野手</button><button data-v="OF">外野手</button>
      </div></div>
    <button class="btn main" style="margin-top:28px" id="btn-start">野球人生を始める ▸ 高校1年春</button>
    <p class="seedline">ワールドシード
      <input id="seed-show" maxlength="24" style="width:120px;background:#fff;color:#a71930;border:1px solid #d9a1aa;border-radius:6px;padding:2px 6px;font-family:inherit;font-size:12px;text-align:center">
      · <a href="#" id="seed-re" style="color:var(--blue)">新しいシード</a><br>同じシード＋同じ選択＝同じ野球人生</p>
    <footer style="text-align:center;margin-top:22px;color:var(--dim);font-size:12px">Produced by <a href="https://x.com/dog_cat_150" target="_blank" rel="noopener" style="color:var(--amber);text-decoration:none">犬猫（@dog_cat_150）</a></footer>
  </div>
</div>
<div id="app">
  <header id="board" style="display:none">
    <div id="bd-top"><div id="bd-name"></div><div id="bd-team"></div><span id="bd-tj" style="color:var(--dim);font-size:11px;margin-left:6px;white-space:nowrap"></span><button id="btn-restart" title="最初からやり直す">↺</button></div>
    <div id="bd-grid">
      <div class="bd-cell"><b id="bd-age">16</b><span>年齢</span></div>
      <div class="bd-cell"><b id="bd-year">2026</b><span>年度</span></div>
      <div class="bd-cell"><b id="bd-ovr">30</b><span>総合</span></div>
      <div class="bd-cell" id="salary-detail-trigger" role="button" tabindex="0" aria-haspopup="dialog"><b id="bd-sal">0</b><span>現在年俸（万円）</span><small>年俸の内訳を見る</small></div>
    </div>
    <div id="lamps">
      <span class="lamp" id="lp0"><i></i>シーズン前</span>
      <span class="lamp" id="lp1"><i></i>シーズン中</span>
      <span class="lamp" id="lp2"><i></i>シーズン終了</span>
    </div>
  </header>
  <nav id="main-nav" aria-label="メインメニュー" style="display:none">
    <button type="button" data-main-view="home" aria-current="page">ホーム</button>
    <button type="button" data-main-view="player">選手</button>
    <button type="button" data-main-view="career">キャリア</button>
  </nav>
  <div id="view-host">
    <section id="view-home" class="main-view" data-main-panel="home">
      <main id="log"></main>
      <button id="act-toggle" style="display:none">⌄ 選択肢を閉じる</button>
      <footer id="act" style="display:none"></footer>
    </section>
    <section id="view-player" class="main-view" data-main-panel="player" hidden>
      <div id="player-tabs" role="tablist" aria-label="選手">
        <button type="button" role="tab" data-player-tab="ability" aria-selected="true">能力・コンディション</button>
        <button type="button" role="tab" data-player-tab="traits" aria-selected="false">特性</button>
      </div>
      <div id="player-content" role="tabpanel" tabindex="0"></div>
    </section>
    <section id="view-career" class="main-view" data-main-panel="career" hidden>
      <div id="career-tabs" role="tablist" aria-label="キャリア">
        <button type="button" role="tab" data-career-tab="stats" aria-selected="true">通算成績</button>
        <button type="button" role="tab" data-career-tab="achievements" aria-selected="false">実績</button>
        <button type="button" role="tab" data-career-tab="contract" aria-selected="false">契約・収入</button>
        <button type="button" role="tab" data-career-tab="yearly" aria-selected="false">年度別</button>
      </div>
      <div id="career-content" role="tabpanel" tabindex="0"></div>
    </section>
  </div>
</div>
<section id="salary-detail-panel" class="salary-detail-panel" role="dialog" aria-modal="true" aria-labelledby="salary-detail-title" hidden>
  <div class="salary-detail-dialog"><button id="salary-detail-close" class="salary-detail-close" aria-label="閉じる">×</button><h2 id="salary-detail-title" tabindex="-1">年俸の内訳</h2><div id="salary-detail-body"></div></div>
</section>



<script type="module" src="./src/main.js"></script>
</body>
</html>
