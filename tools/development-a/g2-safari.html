<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>G2 開發 A 驗收工具（非遊戲）</title>
<style>body{font-family:system-ui;margin:16px;max-width:960px}button{min-height:44px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;min-height:220px;box-sizing:border-box}</style>
<h1>G2 golden vectors 驗收</h1>
<p>僅開發 A 本機驗收。使用實際產品 award-rng-policy.js；不載入遊戲、不改 S、不抽主 RNG。WebKit 不等於 Safari。</p>
<button id="run">執行驗證</button><button id="download" disabled>下載結果 JSON</button>
<pre id="status">等待執行</pre><textarea id="result" readonly aria-label="可複製的驗收 JSON"></textarea>
<script type="module">
import {validateG2} from './g2-validation.js';
let report;
const run=document.querySelector('#run');
run.onclick=async()=>{
 run.disabled=true;
 try{
  const response=await fetch('./g2-vectors.json',{cache:'no-store'});if(!response.ok)throw Error('vector HTTP '+response.status);
  const {vectors}=await response.json(),result=validateG2(vectors);
  const files=['../../docs/src/engine/award-rng-policy.js','./g2-validation.js','./g2-vectors.json'],hashes={};
  for(const file of files){const res=await fetch(file,{cache:'no-store'});if(!res.ok)throw Error(file+' HTTP '+res.status);const bytes=await res.arrayBuffer();
   // Content identity only, never used by the award RNG. HTTP LAN may lack SubtleCrypto.
   hashes[file]=crypto.subtle?Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join(''):'UNAVAILABLE_NON_SECURE_CONTEXT';}
  report={...result,userAgent:navigator.userAgent,executedAt:new Date().toISOString(),url:location.href,
   evidence:'BROWSER_PRODUCT_MODULE; actual Safari requires human platform confirmation',sourceHashes:hashes};
  window.__g2Result=report;document.querySelector('#result').value=JSON.stringify(report,null,2);
  document.querySelector('#status').textContent='PASS '+report.PASS+' / FAIL '+report.FAIL;
  document.querySelector('#download').disabled=false;
 }catch(e){window.__g2Result={FAIL:1,error:String(e.stack||e)};document.querySelector('#status').textContent=String(e.stack||e);}
 finally{run.disabled=false;}
};
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='g2-browser-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
